# Generated from client.yaml by scripts/client.py render aibyao. Edit client.yaml, not this file.
# vault_ids is empty until the vault is applied and its token added (see README).
name: seo-aibyao
agent: ../../agent/agent.md
environment_id: ../../agent/environment.yaml
resources:
- ./memory_store.yaml
vault_ids: []
schedule:
  type: cron
  expression: 10 6 1,15 * *
  timezone: Europe/London
budget:
  type: limit
  max_list_cost:
    amount: '1500'
    currency: USD
initial_events:
- type: user.message
  content:
  - type: text
    text: |
      Client brief for this run. Work only on this client.

      ```yaml
      slug: aibyao
      business_name: AI by AO
      website: https://www.aibyao.com
      repo: Grobler96/AI-by-AO
      branch: main
      host: Vercel
      site_notes: Static HTML on Vercel with cleanUrls and no trailing slash. Pages are flat .html files in the repo root, shared CSS and JS in /assets/. The homepage uses GSAP, ScrollTrigger, Lenis and a canvas globe for heavy scroll animation. The agents/ folder is not part of the website.
      business_type: AI automation and web design agency
      summary: Leeds based agency run by Oliver that builds business automation with n8n, AI phone callers, AI chatbots and fast animated websites for small businesses across West Yorkshire, plus the AI Operations Layer for print and decoration businesses that run on DecoNetwork.
      location: Leeds
      service_area:
      - Leeds
      - West Yorkshire
      services:
      - Business automation with n8n (the main service)
      - AI phone callers and AI receptionists
      - AI chatbots for websites and WhatsApp
      - Web design (fast, animated websites)
      - AI Operations Layer for DecoNetwork print and decoration businesses
      ideal_customers: Small and medium businesses in Leeds and West Yorkshire with repetitive admin, missed calls or slow websites.
      facts:
        phone: ''
        email: grobleroliver@gmail.com
        address: ''
        opening_hours: ''
        founded: ''
        accreditations: []
        social_profiles: []
        other:
        - Founder is Oliver.
        - No prices are published on the website; do not add any.
      style:
        language: British English
        tone: confident, plain and specific, a person talking to a business owner
        no_dashes: true
        allow_dash_words:
        - aiao-consent
      noindex:
      - /thank-you
      do_not_touch:
      - GSAP, ScrollTrigger, Lenis and the globe canvas animation code
      - The loader, cookie banner, analytics and contact form code
      focus:
      - Business automation with n8n
      - Web design in Leeds
      max_changes: 6
      schedule:
        cron: 10 6 1,15 * *
        timezone: Europe/London
      budget_usd: 15
      ```
- type: user.define_outcome
  description: |
    Run this month's SEO review of AI by AO (https://www.aibyao.com) as described in the client brief: audit the site, make up to 6 evidenced, white hat improvements, prove they work, and open one pull request on Grobler96/AI-by-AO from a new seo/YYYY-MM-DD branch into main (unless an earlier seo/ pull request is still open). Save the internal report and the client update to /mnt/session/outputs/ and append this run to seo-log.md in the memory store.
  max_iterations: 3
  rubric:
    type: text
    content: |
      - seo-report-aibyao-YYYY-MM-DD.md and client-update-aibyao-YYYY-MM.md exist in /mnt/session/outputs/ with today's date. The internal report has the sections: In one minute, Changes in this pull request, Health check, Opportunities for next time, Needs the client.
      - Either exactly one new pull request was opened on Grobler96/AI-by-AO from a branch named seo/YYYY-MM-DD into main, with the internal report as its body, or the report states that an earlier seo/ pull request is still open and no new one was opened.
      - Nothing was pushed to main, nothing was merged, and no repository other than Grobler96/AI-by-AO was touched.
      - No more than 6 changes, each with its evidence and how to check it worked.
      - The site audit ran before and after the changes and shows zero errors afterwards; any new warning is explained.
      - Every JSON-LD block touched parses and only states facts from the client brief or the live site; no address, phone, opening hours, reviews, ratings, prices or results were invented.
      - Changed visible copy follows the brief's style (British English, no em dashes, en dashes or hyphenated words) and makes no invented claims.
      - Design, animations, forms, consent, analytics and everything in do_not_touch are unchanged, or the report explains a specific fix.
      - Every changed page has an updated sitemap lastmod, and any new page is in the sitemap, linked from an existing page and copies the existing page structure.
      - PageSpeed Insights results (mobile at least) are recorded for the homepage, or the report says why they could not be fetched.
      - The client update is 150 to 300 words, jargon free, promises no rankings or traffic, and contains no internal notes.
      - seo-log.md in the memory store has a new dated section for this run.
